[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "inky"
version = "0.1.0"
description = "Inky: an untrained ~50M-parameter recurrent language model"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "torch>=2.13,<3",
    "transformers>=5.13,<6",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.0,<10",
]

[tool.setuptools.packages.find]
include = ["inky*"]
