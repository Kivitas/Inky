[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "inky"
version = "0.1.0"
description = "Inky: an untrained ~50M-parameter recurrent language model"
readme = "README.md"
license = { file = "LICENSE" }
classifiers = ["License :: Other/Proprietary License", "Private :: Do Not Upload"]
requires-python = ">=3.10"
dependencies = [
    "torch>=2.13,<3",
    "transformers>=5.13,<6",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.0,<10",
    "ruff>=0.17,<0.18",
]

[tool.setuptools.packages.find]
include = ["inky*"]

[tool.ruff]
line-length = 120
target-version = "py310"
extend-exclude = [".omc", "docs"]

[tool.ruff.lint]
# Conservative rule set: pyflakes, pycodestyle errors, isort, bugbear.
select = ["E", "F", "I", "B"]
# B905 (zip without strict=) would touch every zip() call in inky/ for little gain.
ignore = ["B905"]
